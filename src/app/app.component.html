@if (isInternRoute()) {
  <!-- Interner Login — eigene Vollseite, kein Header/Footer -->
  <router-outlet />
} @else {
  <app-header
    [activeView]="activeView()"
    (viewSelected)="selectView($event)"
    (homeClicked)="goHome()">
  </app-header>

  @if (activeView()) {
    <main id="main-content" class="content-section" tabindex="-1">
      <div class="content-wrap">
        <router-outlet />
      </div>
    </main>
  }
}

<!-- ══════════════════════════════════════════════
     FOOTER — nicht auf /intern
     ══════════════════════════════════════════════ -->
@if (!isInternRoute()) {
<footer class="site-footer">
  <div class="container-xxl">
    <div class="footer-inner d-flex align-items-center flex-wrap gap-3">

      <!-- Markenzeichen -->
      <svg class="footer-duck flex-shrink-0" viewBox="0 0 60 48" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="36" cy="32" rx="18" ry="11"/>
        <circle cx="18" cy="18" r="11"/>
        <path d="M 8 21 L 1 19 L 8 16 Z" fill="currentColor" stroke="none"/>
        <circle cx="14" cy="15" r="2" fill="currentColor" stroke="none"/>
        <path d="M 27 27 Q 37 21 51 26"/>
        <path d="M 53 27 Q 60 19 57 37"/>
      </svg>
      <span class="footer-brand flex-shrink-0">DUCK HOUSE</span>

      <!-- Footer-Navigation -->
      <nav class="footer-nav d-flex align-items-center flex-wrap gap-2"
           aria-label="Footer-Navigation">
        <a class="footer-link" routerLink="/impressum">{{ ts.translator().footerImprint }}</a>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a class="footer-link" routerLink="/datenschutz">{{ ts.translator().footerPrivacy }}</a>
      </nav>

    </div>
  </div>
</footer>
}
