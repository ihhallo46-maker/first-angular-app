<app-header
  [activeView]="activeView()"
  (viewSelected)="selectView($event)"
  (homeClicked)="goHome()">
</app-header>

@if (activeView()) {
  <!-- Inhalts-Bereich für Unterseiten -->
  <main id="main-content" class="content-section" tabindex="-1">
    <div class="content-wrap">
      <router-outlet />
    </div>
  </main>
} @else {
  <!-- Startseite (HomeComponent) -->
  <router-outlet />
}

  <div class="footer-inner">
    <svg class="footer-duck" viewBox="0 0 40 32" fill="none" stroke="currentColor"
         stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <ellipse cx="24" cy="22" rx="12" ry="7"/>
      <circle cx="12" cy="12" r="7"/>
      <path d="M 5 14 L 1 12 L 5 10 Z" fill="currentColor" stroke="none"/>
      <circle cx="9" cy="10" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    <span class="footer-brand">DUCK HOUSE</span>
    <nav class="footer-nav" aria-label="Footer">
      <a class="footer-link" href="#">Impressum</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a class="footer-link" href="#">Kontakt</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a class="footer-link" href="#">Datenschutz</a>
    </nav>
  </div>
</footer>
