<div class="anfahrt-page">
  <div class="row g-0 anfahrt-row">

    <!-- ══ KARTE ══════════════════════════════════════════════ -->
    <div class="col-12 col-lg-7 anfahrt-map-col">
      <iframe
        class="anfahrt-iframe"
        [src]="mapUrl"
        frameborder="0"
        allowfullscreen
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Duck House — Standort auf Google Maps"
        aria-label="Google Maps: Harpener Hellweg 211a, 44805 Bochum">
      </iframe>
    </div>

    <!-- ══ INFO-PANEL ══════════════════════════════════════════ -->
    <div class="col-12 col-lg-5 anfahrt-info-col">
      <div class="anfahrt-info">

        <!-- Eyebrow -->
        <div class="info-eyebrow" aria-hidden="true">
          <span class="ey-line"></span>
          <span class="ey-text">RESTAURANT & ANFAHRT</span>
        </div>
        <h1 class="info-title">Duck House</h1>

        <!-- Adresse -->
        <div class="info-block">
          <div class="info-block-head">
            <i class="bi bi-geo-alt-fill info-icon" aria-hidden="true"></i>
            <span class="info-block-label">Adresse</span>
          </div>
          <p class="info-block-body">
            Harpener Hellweg 211a<br>
            44805 Bochum
          </p>
        </div>

        <!-- Öffnungszeiten -->
        <div class="info-block">
          <div class="info-block-head">
            <i class="bi bi-clock-fill info-icon" aria-hidden="true"></i>
            <span class="info-block-label">Öffnungszeiten</span>
          </div>
          <div class="hours-table">
            <div class="hours-row">
              <span class="hours-days">Mo – Sa &amp; So</span>
              <span class="hours-time">12:00 – 15:00 &nbsp;|&nbsp; 17:30 – 22:00</span>
            </div>
            <div class="hours-row hours-row--closed">
              <span class="hours-days">Dienstag</span>
              <span class="hours-time hours-closed">Ruhetag</span>
            </div>
          </div>
        </div>

        <!-- Telefon -->
        <div class="info-block">
          <div class="info-block-head">
            <i class="bi bi-telephone-fill info-icon" aria-hidden="true"></i>
            <span class="info-block-label">Telefon &amp; Reservierung</span>
          </div>
          <a class="info-phone" href="tel:+492343389688">
            0234 – 33 89 688
          </a>
          <p class="info-note">Reservierungen jederzeit telefonisch möglich.</p>
        </div>

        <!-- CTAs -->
        <div class="info-actions">
          <a class="btn-duck" [href]="directionsUrl"
             target="_blank" rel="noopener noreferrer">
            <i class="bi bi-sign-turn-right" aria-hidden="true"></i>
            Route planen
          </a>
          <a class="btn-duck btn-duck--flat" href="tel:+492343389688">
            <i class="bi bi-telephone" aria-hidden="true"></i>
            Anrufen
          </a>
        </div>

        <!-- Maps-Link -->
        <a class="info-maps-link" [href]="mapsUrl"
           target="_blank" rel="noopener noreferrer">
          <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
          In Google Maps öffnen
        </a>

      </div>
    </div>

  </div>
</div>
